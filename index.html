/* Hueco de la barra de desplazamiento siempre reservado: el título no se mueve cuando aparece la barra tras la colocación */
html.mesa{scrollbar-gutter:stable}
/* marcador de paletas */
html.mesa #gameView .ledsb{background:linear-gradient(180deg,#2b2b2e,#151517);border:2px solid #3d3d41;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 22px rgba(0,0,0,.55)}
html.mesa #gameView .ledv,html.mesa #gameView .ledh{background:#3d3d41}
html.mesa #gameView .ledcr .crest{border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 3px var(--brass);padding:5px;box-sizing:border-box}
html.mesa #gameView .ledsc .ledd{padding:6px 7px;border-radius:6px;background:linear-gradient(180deg,#2e2e33 0 49%,#0e0e10 49% 51%,#232327 51%);box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
html.mesa #gameView .ledd i{background:transparent;border-radius:1px}
html.mesa #gameView .ledd i.on,html.mesa #gameView .ledcol.sm b{background:#f3efe6;box-shadow:none}
html.mesa #gameView .ledcol b{background:var(--brass);border-radius:50%}
html.mesa #gameView .ledbot .ledd{padding:3px;border-radius:3px;background:linear-gradient(180deg,#2e2e33 0 49%,#0e0e10 49% 51%,#232327 51%)}
html.mesa #gameView .ledlab{color:#bdb6a6}
/* nombres de equipo y estrategia */
html.mesa #gameView .gv-team>span{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:17px;letter-spacing:.01em;color:var(--paper)!important;text-shadow:0 2px 0 rgba(0,0,0,.45)}
html.mesa #gameView .gv-team .subb{background:var(--leather);border:1px dashed rgba(201,163,90,.6);color:var(--brass)}
/* cartas de la plantilla */
html.mesa #gameView .ms{background:var(--paper);border:0;border-radius:8px;box-shadow:0 3px 0 var(--paper2),0 6px 10px rgba(0,0,0,.45)}
html.mesa #gameView .roster>.ms:nth-child(odd){transform:rotate(-.6deg)}
html.mesa #gameView .roster>.ms:nth-child(even){transform:rotate(.5deg)}
html.mesa #gameView .roster>.ms:hover{transform:translateY(-2px) rotate(0)}
html.mesa #gameView .roster>.ms{transition:transform .2s cubic-bezier(.3,1.4,.5,1),box-shadow .2s}
html.mesa #gameView .roster>.ms.sel{box-shadow:0 0 0 2px var(--brass),0 5px 0 var(--paper2),0 16px 20px rgba(0,0,0,.55);transform:translateY(-7px) scale(1.05) rotate(0);z-index:3}
html.mesa #gameView .msph{border:0;border-radius:5px;background:var(--ph,repeating-linear-gradient(90deg,var(--c1,#555) 0 9px,color-mix(in srgb,var(--c1,#555) 82%,#fff) 9px 18px))}
html.mesa #gameView .msn{color:var(--ink);text-shadow:none;font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:9.5px}
html.mesa #gameView .msg i{border-radius:3px;color:#1b1b14;font-family:Changa,Rajdhani,sans-serif;font-weight:800;font-size:10.5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
/* minifichas con el mismo tamaño que la muestra (pantallas anchas): 122px de alto, cara 72×96, valores 17×16 y nombre de 22px */
@media(min-width:1700px){
html.mesa #gameView>.mx-auto{max-width:1880px!important}
html.mesa #gameView .gv3{grid-template-columns:minmax(320px,475px) minmax(0,1fr) minmax(320px,475px)}
html.mesa #gameView .roster{gap:8px}
html.mesa #gameView .roster>.ms{height:122px;padding:4px 5px 0 4px;gap:0}
html.mesa #gameView .msr{gap:2px}
html.mesa #gameView .msph{flex:0 1 72px;height:96px;min-width:0}
html.mesa #gameView .msg{grid-template-columns:repeat(2,17px);grid-template-rows:repeat(5,16px);margin:2px 0 0 auto}
html.mesa #gameView .msg i{width:17px;height:16px;font-size:11.5px}
html.mesa #gameView .msg i.t{font-size:10px}
html.mesa #gameView .msn{height:22px;line-height:22px;font-size:12px}
}
html.mesa #gameView .ms.flipd{filter:grayscale(1) brightness(.7) sepia(.3)}
/* dado */
html.mesa #gameView .dcell{background:linear-gradient(180deg,var(--felt1),var(--felt2));border-radius:10px;box-shadow:inset 0 3px 10px rgba(0,0,0,.5)}
html.mesa #gameView .dcell .die{background:linear-gradient(145deg,#fffdf6,#e3dccb);box-shadow:0 5px 0 #b9ae95,0 9px 14px rgba(0,0,0,.5);transform:rotate(-8deg)}
html.mesa #gameView .die .pip{background:var(--leather)}
html.mesa #gameView .dlb{color:#e9dfc6}
html.mesa #gameView .dvl{color:#ffe08a}
html.mesa #gameView .rbtn{background:var(--brass);color:#2a1c0a;box-shadow:0 3px 0 var(--brass2);font-family:'Alfa Slab One',Georgia,serif;font-weight:400;letter-spacing:.03em}
html.mesa #gameView .rbtn:disabled{background:#5a4a35;color:#a99878;box-shadow:none;opacity:1}
/* tarjeta del jugador */
html.mesa #gameView .fcard{background:var(--paper);color:var(--ink);border:0;border-radius:12px;box-shadow:0 5px 0 var(--paper2),0 12px 22px rgba(0,0,0,.5)}
html.mesa #gameView .fcard::before{inset:7px;background:none;border:1.5px solid rgba(43,34,25,.25);border-radius:8px}
html.mesa #gameView .fcard .fh{color:var(--ink);text-shadow:none;font-family:'Alfa Slab One',Georgia,serif;font-weight:400}
html.mesa #gameView .fcard .fh.text-amber-300{color:color-mix(in srgb,var(--c1) 70%,#000)}
html.mesa #gameView .fcard .text-zinc-200,html.mesa #gameView .fcard .text-zinc-300,html.mesa #gameView .fcard .text-zinc-400{color:var(--ink);text-shadow:none}
html.mesa #gameView .fcard .bg-white\/10{background:rgba(43,34,25,.14)}
html.mesa #gameView .fcard .h-1\.5.rounded-full>div,html.mesa #gameView .fcard [style*="box-shadow:0 0 8px"]{box-shadow:none!important}
html.mesa #gameView .fcard .fc-photo{border:0;border-radius:8px;background:var(--ph,repeating-linear-gradient(90deg,var(--c1) 0 14px,color-mix(in srgb,var(--c1) 82%,#fff) 14px 28px))}
html.mesa #gameView .fcard .chip{background:var(--paper2);border-color:transparent;color:var(--ink)}
html.mesa #gameView .fcard .pbs i[style*="255,255,255"]{background:rgba(43,34,25,.15)!important}
html.mesa #gameView .fcard .skv,html.mesa #gameView :is(#cardM,#cardA) .fc-blk .skv{width:30px!important;height:20px!important;padding:0;border:0;border-radius:5px;font-family:Changa,Rajdhani,sans-serif;font-weight:800;font-size:15px!important;line-height:20px!important;letter-spacing:0;color:#1b1b14!important;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
html.mesa #gameView .fc-blk{border-top-color:rgba(43,34,25,.12)}
html.mesa #gameView .fcard span.w-\[5\.1rem\]{font-weight:600} /* nombres de habilidades algo más visibles */
/* paneles de piel: acciones, registro y avisos */
html.mesa #gameView .glass{background:var(--leather);backdrop-filter:none;-webkit-backdrop-filter:none;border:1px dashed rgba(201,163,90,.45);box-shadow:inset 0 2px 8px rgba(0,0,0,.4)}
html.mesa #gameView #turn{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;color:var(--paper)}
html.mesa #gameView #need{color:#d9cdb2}
html.mesa #gameView #log{color:#d9cdb2}
html.mesa #gameView .btn{background:var(--paper);color:var(--ink);border:0;border-radius:5px;box-shadow:0 3px 0 var(--paper2)}
html.mesa #gameView .btn:hover{background:#fff6e0;box-shadow:0 3px 0 var(--paper2);border-color:transparent}
html.mesa #gameView .btn:disabled{opacity:.45}
html.mesa #gameView .btn-end{background:#8e2a22;color:var(--paper);box-shadow:0 3px 0 #5a1712}
html.mesa #gameView .btn-end:hover{background:#a3332a;box-shadow:0 3px 0 #5a1712}
html.mesa #gameView .abtn.cancelon{background:var(--brass)!important;border-color:transparent!important;color:#2a1c0a!important;box-shadow:0 3px 0 var(--brass2)}
/* tablero de fieltro con marco de madera */
html.mesa #gameView .pitchwrap{background:linear-gradient(180deg,#6b4429,#4a2d19);border:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 24px 40px rgba(0,0,0,.55)}
html.mesa #gameView #grid{box-shadow:0 0 0 4px #24502f,0 0 0 8px #8a5d37}
html.mesa #gameView .lt{background:repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 2px,transparent 2px 4px),var(--felt1)}
html.mesa #gameView .dk{background:repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 2px,transparent 2px 4px),var(--felt2)}
html.mesa #gameView .cell{box-shadow:inset 0 0 0 .5px rgba(255,253,240,.14)}
html.mesa #gameView .cell:hover{filter:brightness(1.15);box-shadow:inset 0 0 0 1.5px rgba(255,236,190,.9)}
html.mesa #gameView .mod{color:rgba(233,223,198,.7);font-family:'Alfa Slab One',Georgia,serif;font-weight:400}
html.mesa #gameView .cell svg.arr,html.mesa #gameView .cell svg.hd-ic{fill:#e9dfc6;color:#e9dfc6;opacity:.7}
html.mesa #gameView .hl{box-shadow:inset 0 0 0 2px var(--brass),inset 0 0 0 40px rgba(201,163,90,.22)!important}
html.mesa #gameView .hl.off{box-shadow:inset 0 0 0 2px #c0392b,inset 0 0 0 40px rgba(192,57,43,.2)!important}
/* casilla destino del movimiento grupal: etiqueta marrón oscuro con borde latón, como la del estilo clásico */
html.mesa #gameView .cell.gdst{background:#3a2615!important;box-shadow:inset 0 0 0 2px var(--brass),0 0 10px rgba(201,163,90,.45)!important}
html.mesa #gameView .gdn{color:var(--paper);font-family:'Alfa Slab One',Georgia,serif;font-weight:400;text-shadow:0 1px 0 rgba(0,0,0,.5)}
/* ficha seleccionada: se levanta del tablero como una pieza de juego de mesa; el resto de fichas igual que en el estilo clásico */
html.mesa #gameView .tok.sel{transform:scale(1.2) translateY(-1px);z-index:3;box-shadow:0 0 0 3px var(--brass),0 0 0 5px #3a2a12,0 8px 12px rgba(0,0,0,.5)}
html.mesa #gameView .tok.sel:hover{transform:scale(1.26) translateY(-1px)}
/* porterías y barras de colores como en la muestra */
html.mesa #gameView .goal{border-width:3px;border-color:#f3efe6;background:repeating-linear-gradient(0deg,rgba(255,255,255,.3) 0 1px,transparent 1px 7px),repeating-linear-gradient(90deg,rgba(255,255,255,.3) 0 1px,transparent 1px 7px),#3a2615}
html.mesa #gameView :is(#mk1,#mk2)>div{border-radius:2px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
html.mesa #gameView :is(#mk1,#mk2)>div:is(:nth-child(1),:nth-child(7)){background:#e04a3c!important}
html.mesa #gameView :is(#mk1,#mk2)>div:is(:nth-child(2),:nth-child(6)){background:#f2c94c!important}
html.mesa #gameView :is(#mk1,#mk2)>div:is(:nth-child(3),:nth-child(5)){background:#3fca7a!important}
html.mesa #gameView :is(#mk1,#mk2)>div:nth-child(4){background:#f3efe6!important}
</style>
</head>
