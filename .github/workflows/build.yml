      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VozGhost.apk
          gh release create "v${{ github.run_number }}" VozGhost.apk \
            --repo "${{ github.repository }}" \
            --title "Voz Ghost ${{ github.run_number }}" \
            --notes "Descarga VozGhost.apk en el móvil e instálalo."
