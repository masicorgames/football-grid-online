name: Compilar Voz Ghost

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Crear el proyecto
        run: |
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'GHOSTEOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mario.vozghost'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mario.vozghost"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "1.2"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GHOSTEOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'GHOSTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />

              <application
                  android:label="Voz Ghost"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VoiceService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          GHOSTEOF
          mkdir -p "$(dirname 'app/src/main/java/com/mario/vozghost/AudioEngine.java')"
          cat > 'app/src/main/java/com/mario/vozghost/AudioEngine.java' <<'GHOSTEOF'
          package com.mario.vozghost;

          import android.content.Context;
          import android.media.AudioAttributes;
          import android.media.AudioDeviceInfo;
          import android.media.AudioManager;
          import android.media.AudioFormat;
          import android.media.AudioRecord;
          import android.media.AudioTrack;
          import android.media.MediaRecorder;
          import android.media.audiofx.AcousticEchoCanceler;
          import android.media.audiofx.NoiseSuppressor;
          import android.os.Build;
          import android.os.Process;

          /** Micrófono -> GhostDsp -> altavoz/auriculares, en un hilo de audio de baja latencia. */
          public final class AudioEngine {

              // Ajustes compartidos con la interfaz
              public static volatile float semitones = -4f;
              public static volatile float drive = 2f;
              public static volatile float gateDb = -48f;
              public static volatile float outGain = 1.6f;
              public static volatile boolean phone = false;
              public static volatile boolean cleanMic = true; // filtros del propio móvil contra ruido y acople
              public static volatile boolean btMic = false;   // micro de auriculares Bluetooth, voz por el altavoz del móvil

              public static volatile boolean running = false;
              public static volatile float level = 0f;
              public static volatile String error = null;

              private Thread thread;
              private Context ctx;

              public synchronized void start(Context context) {
                  if (thread != null) return;
                  ctx = context.getApplicationContext();
                  error = null;
                  running = true;
                  thread = new Thread(this::loop, "VozGhostAudio");
                  thread.start();
              }

              public synchronized void stop() {
                  running = false;
                  if (thread != null) {
                      try { thread.join(1500); } catch (InterruptedException ignored) { }
                      thread = null;
                  }
                  level = 0f;
              }

              private void loop() {
                  Process.setThreadPriority(Process.THREAD_PRIORITY_URGENT_AUDIO);
                  AudioRecord rec = null;
                  AudioTrack track = null;
                  NoiseSuppressor ns = null;
                  AcousticEchoCanceler aec = null;
                  AudioManager am = ctx.getSystemService(AudioManager.class);
                  final boolean useBt = btMic;
                  try {
                      AudioDeviceInfo btIn = null, speaker = null;
                      if (useBt) {
                          btIn = findBluetoothMic(am);
                          if (btIn == null) throw new IllegalStateException(
                                  "No encuentro el micro de los auriculares Bluetooth. ¿Están conectados al móvil?");
                          am.setMode(AudioManager.MODE_IN_COMMUNICATION);
                          if (Build.VERSION.SDK_INT >= 31) {
                              for (AudioDeviceInfo d : am.getAvailableCommunicationDevices()) {
                                  if (d.getType() == AudioDeviceInfo.TYPE_BLUETOOTH_SCO) {
                                      am.setCommunicationDevice(d);
                                      break;
                                  }
                              }
                          } else {
                              am.startBluetoothSco();
                              am.setBluetoothScoOn(true);
                          }
                          Thread.sleep(900); // el enlace de micro Bluetooth tarda un momento en abrirse
                          for (AudioDeviceInfo d : am.getDevices(AudioManager.GET_DEVICES_OUTPUTS)) {
                              if (d.getType() == AudioDeviceInfo.TYPE_BUILTIN_SPEAKER) speaker = d;
                          }
                      }

                      int sr = 48000;
                      int source = (cleanMic || useBt) ? MediaRecorder.AudioSource.VOICE_COMMUNICATION
                              : MediaRecorder.AudioSource.MIC;
                      rec = openRecorder(sr, source);
                      if (rec == null) { sr = 44100; rec = openRecorder(sr, source); }
                      if (rec == null) { rec = openRecorder(48000, MediaRecorder.AudioSource.MIC); sr = 48000; }
                      if (rec == null) throw new IllegalStateException("No se pudo abrir el micrófono");

                      int minOut = AudioTrack.getMinBufferSize(sr, AudioFormat.CHANNEL_OUT_MONO,
                              AudioFormat.ENCODING_PCM_16BIT);
                      track = new AudioTrack.Builder()
                              .setAudioAttributes(new AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_MEDIA)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                      .build())
                              .setAudioFormat(new AudioFormat.Builder()
                                      .setSampleRate(sr)
                                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                      .build())
                              .setBufferSizeInBytes(Math.max(minOut * 4, 8192))
                              .setTransferMode(AudioTrack.MODE_STREAM)
                              .setPerformanceMode(AudioTrack.PERFORMANCE_MODE_LOW_LATENCY)
                              .build();

                      GhostDsp dsp = new GhostDsp(sr);
                      final int frame = 256;
                      short[] inS = new short[frame];
                      short[] outS = new short[frame];
                      float[] inF = new float[frame];
                      float[] outF = new float[frame];

                      if (cleanMic) {
                          int id = rec.getAudioSessionId();
                          if (NoiseSuppressor.isAvailable()) {
                              ns = NoiseSuppressor.create(id);
                              if (ns != null) ns.setEnabled(true);
                          }
                          if (AcousticEchoCanceler.isAvailable()) {
                              aec = AcousticEchoCanceler.create(id);
                              if (aec != null) aec.setEnabled(true);
                          }
                      }

                      if (btIn != null) rec.setPreferredDevice(btIn);
                      if (speaker != null) track.setPreferredDevice(speaker);

                      rec.startRecording();
                      track.play();
                      // colchón de silencio para que el altavoz nunca se quede sin datos (evita crujidos)
                      short[] cushion = new short[(int) (sr * 0.04)];
                      track.write(cushion, 0, cushion.length);

                      while (running) {
                          int n = rec.read(inS, 0, frame);
                          if (n <= 0) continue;
                          dsp.semitones = semitones;
                          dsp.drive = drive;
                          dsp.gateDb = gateDb;
                          dsp.outGain = outGain;
                          dsp.phone = phone;

                          for (int i = 0; i < n; i++) inF[i] = inS[i] / 32768f;
                          dsp.process(inF, outF, n);
                          float peak = 0f;
                          for (int i = 0; i < n; i++) {
                              float v = outF[i];
                              float av = Math.abs(v);
                              if (av > peak) peak = av;
                              outS[i] = (short) (v * 32767f);
                          }
                          level = level * 0.8f + peak * 0.2f;
                          track.write(outS, 0, n);
                      }
                  } catch (SecurityException e) {
                      error = "Falta el permiso del micrófono";
                  } catch (Exception e) {
                      error = e.getMessage() != null ? e.getMessage() : e.toString();
                  } finally {
                      running = false;
                      if (ns != null) ns.release();
                      if (aec != null) aec.release();
                      if (rec != null) { try { rec.stop(); } catch (Exception ignored) { } rec.release(); }
                      if (track != null) { try { track.stop(); } catch (Exception ignored) { } track.release(); }
                      if (useBt) {
                          try {
                              if (Build.VERSION.SDK_INT >= 31) {
                                  am.clearCommunicationDevice();
                              } else {
                                  am.setBluetoothScoOn(false);
                                  am.stopBluetoothSco();
                              }
                              am.setMode(AudioManager.MODE_NORMAL);
                          } catch (Exception ignored) { }
                      }
                  }
              }

              private static AudioDeviceInfo findBluetoothMic(AudioManager am) {
                  for (AudioDeviceInfo d : am.getDevices(AudioManager.GET_DEVICES_INPUTS)) {
                      if (d.getType() == AudioDeviceInfo.TYPE_BLUETOOTH_SCO) return d;
                  }
                  if (Build.VERSION.SDK_INT >= 31) {
                      for (AudioDeviceInfo d : am.getAvailableCommunicationDevices()) {
                          if (d.getType() == AudioDeviceInfo.TYPE_BLUETOOTH_SCO) return d;
                      }
                  }
                  return null;
              }

              private static AudioRecord openRecorder(int sr, int source) {
                  int min = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT);
                  if (min <= 0) return null;
                  AudioRecord r = new AudioRecord(source, sr,
                          AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, Math.max(min * 2, 2048));
                  if (r.getState() != AudioRecord.STATE_INITIALIZED) {
                      r.release();
                      return null;
                  }
                  return r;
              }
          }
          GHOSTEOF
          mkdir -p "$(dirname 'app/src/main/java/com/mario/vozghost/GhostDsp.java')"
          cat > 'app/src/main/java/com/mario/vozghost/GhostDsp.java' <<'GHOSTEOF'
          package com.mario.vozghost;

          /**
           * Procesado de voz estilo "Ghostface". Java puro (sin clases de Android) para poder probarlo.
           * Cadena: filtro graves -> bajada de tono (WSOLA: los saltos se hacen donde la onda coincide,
           * así no hay temblor) -> realce de pecho -> distorsión suave -> teléfono opcional
           * -> puerta de ruido con histéresis -> volumen.
           */
          public final class GhostDsp {

              private final float sampleRate;

              // --- bajada de tono ---
              private static final int RING = 1 << 16;
              private static final int RMASK = RING - 1;
              private final float[] ring = new float[RING];
              private long wAbs = 0;                 // muestras escritas
              private final int L, H, S;             // grano, salto, margen de búsqueda
              private final int targetLag, maxLag, minLag;
              private final float[] win;
              private final float[] tail, hopOut, grainBuf, target;
              private int outPos;
              private double pPrev = -1;             // inicio del grano anterior (posición absoluta)
              private boolean started = false;
              private float curRatio = 1f;

              public float semitones = -4f;
              public float drive = 2f;
              public float gateDb = -48f;
              public float outGain = 1.6f;
              public boolean phone = false;

              private final Biquad inHp, chest, hiss, phoneHp, phoneLp;
              private float env = 0f, gateGain = 0f;
              private boolean gateOpen = false;
              private int holdLeft = 0;
              private final int holdSamples;

              public GhostDsp(float sampleRate) {
                  this.sampleRate = sampleRate;
                  L = Math.round(0.040f * sampleRate) & ~1;   // 40 ms
                  H = L / 2;                                   // 20 ms
                  S = Math.round(0.011f * sampleRate);         // ±11 ms (cubre voces graves)
                  targetLag = S + 32;
                  maxLag = targetLag + 2 * S;
                  minLag = 8;
                  win = new float[L];
                  for (int j = 0; j < L; j++) win[j] = (float) (0.5 - 0.5 * Math.cos(2 * Math.PI * j / L));
                  tail = new float[H];
                  hopOut = new float[H];
                  grainBuf = new float[L];
                  target = new float[H];
                  outPos = 0;
                  holdSamples = Math.round(0.18f * sampleRate);

                  inHp = Biquad.highpass(sampleRate, 90f, 0.707f);
                  chest = Biquad.peaking(sampleRate, 170f, 1.0f, 5f);
                  hiss = Biquad.lowpass(sampleRate, 6000f, 0.707f);
                  phoneHp = Biquad.highpass(sampleRate, 380f, 0.8f);
                  phoneLp = Biquad.lowpass(sampleRate, 3000f, 0.9f);
              }

              public void process(float[] in, float[] out, int n) {
                  final float k = drive;
                  final float norm = k > 0.05f ? (float) (1.0 / Math.tanh(k)) : 1f;
                  final float openLin = (float) Math.pow(10.0, gateDb / 20.0);
                  final float closeLin = openLin * 0.5f;     // 6 dB de histéresis: no abre y cierra a lo loco
                  final float attack = 1f - (float) Math.exp(-1.0 / (0.003 * sampleRate));
                  final float release = 1f - (float) Math.exp(-1.0 / (0.080 * sampleRate));
                  final float gateUp = 1f - (float) Math.exp(-1.0 / (0.008 * sampleRate));
                  final float gateDown = 1f - (float) Math.exp(-1.0 / (0.060 * sampleRate));
                  curRatio = (float) Math.pow(2.0, semitones / 12.0);

                  for (int i = 0; i < n; i++) {
                      ring[(int) (wAbs & RMASK)] = inHp.process(in[i]);
                      wAbs++;

                      if (outPos == H) { synthHop(); outPos = 0; }
                      float y = hopOut[outPos++];

                      // puerta de ruido sobre la voz ya transformada
                      float a = Math.abs(y);
                      env += (a - env) * (a > env ? attack : release);
                      if (env > openLin) { gateOpen = true; holdLeft = holdSamples; }
                      else if (env < closeLin) {
                          if (holdLeft > 0) holdLeft--; else gateOpen = false;
                      }
                      float g = gateOpen ? 1f : 0f;
                      gateGain += (g - gateGain) * (g > gateGain ? gateUp : gateDown);

                      y = chest.process(y);
                      y = hiss.process(y);
                      if (k > 0.05f) y = (float) Math.tanh(k * y) * norm;
                      if (phone) y = phoneLp.process(phoneHp.process(y)) * 1.8f;
                      y *= gateGain * outGain;
                      if (y > 1f) y = 1f;
                      else if (y < -1f) y = -1f;
                      out[i] = y;
                  }
              }

              /** Genera los siguientes H samples de salida (solapamiento al 50 % con ventana Hann). */
              private void synthHop() {
                  final double r = curRatio;
                  if (!started) {
                      if (wAbs < L * 2L + maxLag + S) { java.util.Arrays.fill(hopOut, 0f); return; }
                      pPrev = wAbs - L * r - targetLag - H * r;
                      started = true;
                      java.util.Arrays.fill(tail, 0f);
                  }

                  double pNat = pPrev + H * r;                 // continuación perfecta
                  double lag = wAbs - (pNat + L * r);          // margen que queda hasta lo último grabado
                  double p = pNat;

                  if (lag > maxLag || lag < minLag) {
                      // hay que saltar: buscamos el punto donde la onda encaja con lo que estaba sonando
                      for (int j = 0; j < H; j++) target[j] = read(pPrev + (H + j) * r);
                      double center = wAbs - L * r - targetLag;
                      int best = 0;
                      double bestScore = -1e30;
                      for (int d = -S; d <= S; d += 3) {
                          double sc = score(center + d, r, 4);
                          if (sc > bestScore) { bestScore = sc; best = d; }
                      }
                      int coarse = best;
                      for (int d = coarse - 3; d <= coarse + 3; d++) {
                          if (d < -S || d > S) continue;
                          double sc = score(center + d, r, 1);
                          if (sc > bestScore) { bestScore = sc; best = d; }
                      }
                      p = center + best;
                  }

                  for (int j = 0; j < L; j++) grainBuf[j] = read(p + j * r) * win[j];
                  for (int j = 0; j < H; j++) {
                      hopOut[j] = tail[j] + grainBuf[j];
                      tail[j] = grainBuf[H + j];
                  }
                  pPrev = p;
              }

              private double score(double start, double r, int step) {
                  double xy = 0, yy = 1e-9;
                  for (int j = 0; j < H; j += step) {
                      float c = read(start + j * r);
                      xy += c * target[j];
                      yy += c * c;
                  }
                  return xy / Math.sqrt(yy);
              }

              private float read(double pos) {
                  long i0 = (long) Math.floor(pos);
                  float frac = (float) (pos - i0);
                  float s0 = ring[(int) (i0 & RMASK)];
                  float s1 = ring[(int) ((i0 + 1) & RMASK)];
                  return s0 + (s1 - s0) * frac;
              }

              /** Filtro biquad (fórmulas RBJ). */
              static final class Biquad {
                  private final float b0, b1, b2, a1, a2;
                  private float x1, x2, y1, y2;

                  private Biquad(double b0, double b1, double b2, double a0, double a1, double a2) {
                      this.b0 = (float) (b0 / a0);
                      this.b1 = (float) (b1 / a0);
                      this.b2 = (float) (b2 / a0);
                      this.a1 = (float) (a1 / a0);
                      this.a2 = (float) (a2 / a0);
                  }

                  static Biquad highpass(float sr, float f, float q) {
                      double w = 2 * Math.PI * f / sr, c = Math.cos(w), al = Math.sin(w) / (2 * q);
                      return new Biquad((1 + c) / 2, -(1 + c), (1 + c) / 2, 1 + al, -2 * c, 1 - al);
                  }

                  static Biquad lowpass(float sr, float f, float q) {
                      double w = 2 * Math.PI * f / sr, c = Math.cos(w), al = Math.sin(w) / (2 * q);
                      return new Biquad((1 - c) / 2, 1 - c, (1 - c) / 2, 1 + al, -2 * c, 1 - al);
                  }

                  static Biquad peaking(float sr, float f, float q, float gainDb) {
                      double A = Math.pow(10, gainDb / 40.0);
                      double w = 2 * Math.PI * f / sr, c = Math.cos(w), al = Math.sin(w) / (2 * q);
                      return new Biquad(1 + al * A, -2 * c, 1 - al * A, 1 + al / A, -2 * c, 1 - al / A);
                  }

                  float process(float x) {
                      float y = b0 * x + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
                      x2 = x1; x1 = x;
                      y2 = y1; y1 = y;
                      return y;
                  }
              }
          }
          GHOSTEOF
          mkdir -p "$(dirname 'app/src/main/java/com/mario/vozghost/MainActivity.java')"
          cat > 'app/src/main/java/com/mario/vozghost/MainActivity.java' <<'GHOSTEOF'
          package com.mario.vozghost;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.Switch;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private static final int BG = Color.rgb(10, 10, 12);
              private static final int PANEL = Color.rgb(24, 24, 28);
              private static final int TEXT = Color.rgb(236, 236, 240);
              private static final int MUTED = Color.rgb(150, 150, 160);
              private static final int BLOOD = Color.rgb(200, 16, 32);

              private Button toggle;
              private TextView status;
              private ProgressBar meter;
              private SeekBar pitchBar, driveBar, volBar, gateBar;
              private TextView pitchVal, driveVal, volVal, gateVal;
              private Switch phoneSwitch, cleanSwitch, btSwitch;
              private SharedPreferences prefs;
              private final Handler ui = new Handler(Looper.getMainLooper());
              private boolean wantRunning = false;
              private boolean loading = true;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
                  prefs = getSharedPreferences("ajustes", MODE_PRIVATE);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(BG);
                  scroll.setFillViewport(true);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(28), dp(20), dp(28));
                  scroll.addView(root);

                  TextView title = text("VOZ GHOST", 34, TEXT);
                  title.setTypeface(Typeface.create("sans-serif-condensed", Typeface.BOLD));
                  title.setLetterSpacing(0.12f);
                  root.addView(title);
                  TextView sub = text("¿Cuál es tu película de miedo favorita?", 15, MUTED);
                  sub.setTypeface(Typeface.create("serif", Typeface.ITALIC));
                  root.addView(sub, lp(0, dp(4), 0, dp(24)));

                  toggle = new Button(this);
                  toggle.setTextSize(20);
                  toggle.setTypeface(Typeface.DEFAULT_BOLD);
                  toggle.setTextColor(Color.WHITE);
                  toggle.setAllCaps(true);
                  toggle.setOnClickListener(v -> onToggle());
                  LinearLayout.LayoutParams tp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(72));
                  root.addView(toggle, tp);

                  status = text("", 14, MUTED);
                  status.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.addView(status, lp(0, dp(10), 0, dp(6)));

                  meter = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  meter.setMax(100);
                  meter.setProgressTintList(android.content.res.ColorStateList.valueOf(BLOOD));
                  meter.setProgressBackgroundTintList(android.content.res.ColorStateList.valueOf(PANEL));
                  root.addView(meter, lp(0, 0, 0, dp(24)));

                  root.addView(section("Voces"));
                  LinearLayout presets = new LinearLayout(this);
                  presets.setOrientation(LinearLayout.HORIZONTAL);
                  presets.addView(preset("Clásica", -4, 2.0f, 160, false), weight());
                  presets.addView(preset("Teléfono", -3, 3.0f, 180, true), weight());
                  presets.addView(preset("Demonio", -8, 5.0f, 170, false), weight());
                  root.addView(presets, lp(0, 0, 0, dp(20)));

                  root.addView(section("Ajustes"));
                  pitchVal = new TextView(this);
                  pitchBar = slider(root, "Tono", pitchVal, 12, (p) -> {
                      AudioEngine.semitones = -p;
                      pitchVal.setText(p == 0 ? "normal" : "−" + p + " semitonos");
                  });
                  driveVal = new TextView(this);
                  driveBar = slider(root, "Distorsión", driveVal, 80, (p) -> {
                      AudioEngine.drive = p / 10f;
                      driveVal.setText(String.valueOf(p / 10f));
                  });
                  volVal = new TextView(this);
                  volBar = slider(root, "Volumen", volVal, 300, (p) -> {
                      AudioEngine.outGain = p / 100f;
                      volVal.setText(p + " %");
                  });
                  gateVal = new TextView(this);
                  gateBar = slider(root, "Silenciar ruido de fondo", gateVal, 40, (p) -> {
                      AudioEngine.gateDb = -70f + p;
                      gateVal.setText(p == 0 ? "apagado" : p < 15 ? "suave" : p < 28 ? "medio" : "fuerte");
                  });

                  phoneSwitch = new Switch(this);
                  phoneSwitch.setText("Efecto teléfono");
                  phoneSwitch.setTextColor(TEXT);
                  phoneSwitch.setTextSize(16);
                  phoneSwitch.setOnCheckedChangeListener((s, on) -> {
                      AudioEngine.phone = on;
                      save();
                  });
                  root.addView(phoneSwitch, lp(0, dp(8), 0, dp(8)));

                  cleanSwitch = new Switch(this);
                  cleanSwitch.setText("Filtro anti-ruido y anti-acople del móvil");
                  cleanSwitch.setTextColor(TEXT);
                  cleanSwitch.setTextSize(16);
                  cleanSwitch.setOnCheckedChangeListener((s, on) -> {
                      AudioEngine.cleanMic = on;
                      save();
                      if (AudioEngine.running) status.setText("Para y vuelve a activar la voz para aplicarlo");
                  });
                  root.addView(cleanSwitch, lp(0, dp(8), 0, dp(8)));

                  btSwitch = new Switch(this);
                  btSwitch.setText("Micro de los auriculares Bluetooth (la voz sale por el altavoz del móvil)");
                  btSwitch.setTextColor(TEXT);
                  btSwitch.setTextSize(16);
                  btSwitch.setOnCheckedChangeListener((s, on) -> {
                      AudioEngine.btMic = on;
                      save();
                      if (AudioEngine.running) status.setText("Para y vuelve a activar la voz para aplicarlo");
                  });
                  root.addView(btSwitch, lp(0, dp(8), 0, dp(24)));

                  TextView tip = text("Consejo: si usas el micro del propio móvil, saca la voz por un altavoz Bluetooth "
                          + "separado del móvil; con el altavoz del móvil, el micro se oye a sí mismo y pita. "
                          + "Con auriculares Bluetooth, activa la opción del micro de los auriculares y la voz "
                          + "saldrá por el móvil. "
                          + "Para que suene más a la peli, habla despacio, grave y con pausas.", 13, MUTED);
                  tip.setLineSpacing(dp(3), 1f);
                  GradientDrawable tipBg = new GradientDrawable();
                  tipBg.setColor(PANEL);
                  tipBg.setCornerRadius(dp(10));
                  tip.setBackground(tipBg);
                  tip.setPadding(dp(14), dp(12), dp(14), dp(12));
                  root.addView(tip);

                  setContentView(scroll);
                  load();
                  refreshButton();
                  ui.post(tick);
              }

              private final Runnable tick = new Runnable() {
                  @Override
                  public void run() {
                      boolean on = AudioEngine.running;
                      meter.setProgress(on ? Math.min(100, (int) (AudioEngine.level * 140)) : 0);
                      if (wantRunning && !on && AudioEngine.error != null) {
                          wantRunning = false;
                          stopService(new Intent(MainActivity.this, VoiceService.class));
                          status.setText("Error: " + AudioEngine.error);
                          refreshButton();
                      }
                      ui.postDelayed(this, 50);
                  }
              };

              private void onToggle() {
                  if (wantRunning || AudioEngine.running) {
                      wantRunning = false;
                      stopService(new Intent(this, VoiceService.class));
                      status.setText("Parada");
                      refreshButton();
                      return;
                  }
                  List<String> need = new ArrayList<>();
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      need.add(Manifest.permission.RECORD_AUDIO);
                  }
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      need.add(Manifest.permission.POST_NOTIFICATIONS);
                  }
                  if (need.contains(Manifest.permission.RECORD_AUDIO)) {
                      requestPermissions(need.toArray(new String[0]), 7);
                  } else {
                      startVoice();
                  }
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                      startVoice();
                  } else {
                      status.setText("Sin permiso de micrófono no puedo cambiarte la voz");
                  }
              }

              private void startVoice() {
                  wantRunning = true;
                  AudioEngine.error = null;
                  startForegroundService(new Intent(this, VoiceService.class));
                  status.setText("Activa. Habla…");
                  refreshButton();
              }

              private void refreshButton() {
                  boolean on = wantRunning || AudioEngine.running;
                  wantRunning = on;
                  toggle.setText(on ? "Parar voz" : "Activar voz");
                  GradientDrawable bg = new GradientDrawable();
                  bg.setCornerRadius(dp(14));
                  bg.setColor(on ? Color.rgb(60, 60, 66) : BLOOD);
                  toggle.setBackground(bg);
                  if (on && status.getText().length() == 0) status.setText("Activa. Habla…");
              }

              // ---------- ajustes guardados ----------

              private void load() {
                  loading = true;
                  int pitch = prefs.getInt("pitch", 4), drive = prefs.getInt("drive", 20);
                  int vol = prefs.getInt("vol", 160), gate = prefs.getInt("gate", 22);
                  boolean phone = prefs.getBoolean("phone", false), clean = prefs.getBoolean("clean", true);
                  boolean bt = prefs.getBoolean("bt", false);
                  pitchBar.setProgress(pitch);
                  driveBar.setProgress(drive);
                  volBar.setProgress(vol);
                  gateBar.setProgress(gate);
                  cleanSwitch.setChecked(clean);
                  phoneSwitch.setChecked(phone);
                  btSwitch.setChecked(bt);
                  AudioEngine.btMic = bt;
                  AudioEngine.cleanMic = cleanSwitch.isChecked();
                  AudioEngine.phone = phoneSwitch.isChecked();
                  loading = false;
              }

              private void save() {
                  if (loading) return;
                  prefs.edit()
                          .putInt("pitch", pitchBar.getProgress())
                          .putInt("drive", driveBar.getProgress())
                          .putInt("vol", volBar.getProgress())
                          .putInt("gate", gateBar.getProgress())
                          .putBoolean("phone", phoneSwitch.isChecked())
                          .putBoolean("clean", cleanSwitch == null || cleanSwitch.isChecked())
                          .putBoolean("bt", btSwitch != null && btSwitch.isChecked())
                          .apply();
              }

              // ---------- piezas de interfaz ----------

              private interface OnValue { void set(int p); }

              private SeekBar slider(LinearLayout root, String label, TextView value, int max, OnValue cb) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  TextView l = text(label, 15, TEXT);
                  row.addView(l, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  value.setTextColor(MUTED);
                  value.setTextSize(14);
                  row.addView(value);
                  root.addView(row, lp(0, dp(6), 0, 0));

                  SeekBar bar = new SeekBar(this);
                  bar.setMax(max);
                  bar.setProgressTintList(android.content.res.ColorStateList.valueOf(BLOOD));
                  bar.setThumbTintList(android.content.res.ColorStateList.valueOf(TEXT));
                  bar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int p, boolean user) { cb.set(p); if (user) save(); }
                      public void onStartTrackingTouch(SeekBar s) { }
                      public void onStopTrackingTouch(SeekBar s) { }
                  });
                  root.addView(bar, lp(0, dp(4), 0, dp(12)));
                  cb.set(bar.getProgress());
                  return bar;
              }

              private Button preset(String name, int semis, float drive, int vol, boolean phone) {
                  Button b = new Button(this);
                  b.setText(name);
                  b.setAllCaps(false);
                  b.setTextColor(TEXT);
                  b.setTextSize(15);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(PANEL);
                  bg.setCornerRadius(dp(10));
                  bg.setStroke(dp(1), Color.rgb(60, 60, 66));
                  b.setBackground(bg);
                  b.setOnClickListener(v -> {
                      pitchBar.setProgress(-semis);
                      driveBar.setProgress((int) (drive * 10));
                      volBar.setProgress(vol);
                      phoneSwitch.setChecked(phone);
                  btSwitch.setChecked(bt);
                  AudioEngine.btMic = bt;
                      save();
                  });
                  return b;
              }

              private TextView section(String s) {
                  TextView t = text(s.toUpperCase(), 12, MUTED);
                  t.setLetterSpacing(0.15f);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setPadding(0, 0, 0, dp(10));
                  return t;
              }

              private TextView text(String s, int sp, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  return t;
              }

              private LinearLayout.LayoutParams lp(int l, int t, int r, int bm) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  p.setMargins(l, t, r, bm);
                  return p;
              }

              private LinearLayout.LayoutParams weight() {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0, dp(52), 1f);
                  p.setMargins(dp(4), 0, dp(4), 0);
                  return p;
              }

              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              @Override
              protected void onDestroy() {
                  ui.removeCallbacks(tick);
                  super.onDestroy();
              }
          }
          GHOSTEOF
          mkdir -p "$(dirname 'app/src/main/java/com/mario/vozghost/VoiceService.java')"
          cat > 'app/src/main/java/com/mario/vozghost/VoiceService.java' <<'GHOSTEOF'
          package com.mario.vozghost;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          /** Mantiene la voz funcionando con la pantalla apagada o el móvil en el bolsillo. */
          public class VoiceService extends Service {

              public static final String ACTION_STOP = "com.mario.vozghost.STOP";
              private static final String CHANNEL = "voz";
              private static final AudioEngine ENGINE = new AudioEngine();
              private PowerManager.WakeLock wakeLock;

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel(CHANNEL, "Voz activa",
                          NotificationManager.IMPORTANCE_LOW));

                  PendingIntent open = PendingIntent.getActivity(this, 0,
                          new Intent(this, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                  PendingIntent stop = PendingIntent.getService(this, 1,
                          new Intent(this, VoiceService.class).setAction(ACTION_STOP),
                          PendingIntent.FLAG_IMMUTABLE);

                  Notification n = new Notification.Builder(this, CHANNEL)
                          .setSmallIcon(R.drawable.ic_mask)
                          .setContentTitle("Voz Ghost activa")
                          .setContentText("Tu voz se está transformando")
                          .setContentIntent(open)
                          .addAction(new Notification.Action.Builder(null, "Parar", stop).build())
                          .setOngoing(true)
                          .build();

                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                  } else {
                      startForeground(1, n);
                  }

                  if (wakeLock == null) {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "VozGhost:audio");
                      wakeLock.acquire(6 * 60 * 60 * 1000L); // máximo 6 horas de fiesta
                  }
                  ENGINE.start(this);
                  return START_NOT_STICKY;
              }

              @Override
              public void onDestroy() {
                  ENGINE.stop();
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  wakeLock = null;
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
